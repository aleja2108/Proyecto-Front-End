<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechNova - Catálogo de Noticias</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Estilos propios -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ===================== HEADER / NAVBAR ===================== -->
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark navbar-technova">
            <div class="container-fluid px-4">
                <a class="navbar-brand fw-bold" href="Index.html">TECHNOVA</a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Alternar navegación">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                    <ul class="navbar-nav align-items-lg-center gap-lg-2">
                        <li class="nav-item">
                            <a class="nav-link" href="Index.html">Inicio</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active fw-semibold text-decoration-underline" href="listadoNoticias.html" aria-current="page">Noticias</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="favoritos.html">Favoritos</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="Acercade.html">Acerca de</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="Contacto.html">Contacto</a>
                        </li>
                        <li class="nav-item ms-lg-3">
                            <form class="d-flex" role="search">
                                <input class="form-control form-control-sm search-input" type="search" placeholder="Buscar..." aria-label="Buscar">
                            </form>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <!-- ===================== CONTENIDO PRINCIPAL ===================== -->
    <main>
        <h1 class="text-center mt-4">Catálogo de Noticias</h1>

        <!-- Barra de Filtros -->
        <section class="filters">
            <input type="text" id="searchInput" placeholder="Buscar noticia...">
            <select id="categorySelect">
                <option value="todas">Categoría ▼</option>
                <option value="tecnologia">Tecnología</option>
                <option value="ciencia">Ciencia</option>
                <option value="videojuegos">Videojuegos</option>
            </select>
        </section>

        <!-- Grid de Noticias -->
        <section id="newsGrid" class="news-grid">
            <!-- Aquí JavaScript insertará las tarjetas -->
        </section>

        <!-- Paginación -->
        <section class="pagination" id="pagination">
            <!-- Aquí JavaScript insertará los botones de página -->
        </section>
    </main>

    <!-- ===================== FOOTER ===================== -->
    <footer class="footer-technova py-4">
        <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center text-center text-md-start gap-3">
            <div>
                <h5 class="mb-0 fw-bold">TechNova</h5>
                <small>Plataforma de Noticias Tecnológicas</small>
            </div>
            <div class="text-md-end">
                <small class="d-block">Enlaces: Inicio | Noticias | Contacto</small>
                <small class="d-block">contacto@technova.com</small>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
